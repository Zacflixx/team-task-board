<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>Team Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim header, five stage columns in one horizontally scrolling row (stacked cards inside each), modal dialog for add and edit. */
:root {
  --bg: #f4f2ff;
  --surface: #ffffff;
  --surface-2: #f8f7ff;
  --ink: #1b1740;
  --muted: #5d5a85;
  --line: #dedbf3;
  --accent: #5b4bdb;
  --accent-2: #c026d3;
  --accent-ink: #ffffff;
  --danger: #c0261e;
  --scrim: rgba(20, 14, 52, 0.5);
  --shadow: 0 1px 2px rgba(40, 28, 110, 0.08), 0 4px 14px rgba(40, 28, 110, 0.06);
  --shadow-lift: 0 2px 4px rgba(40, 28, 110, 0.1), 0 10px 24px rgba(40, 28, 110, 0.14);
  --s-todo: #6f7fa3;
  --s-prog: #2f7bff;
  --s-almost: #f08c00;
  --s-done: #12a05c;
  --s-live: #a23fe8;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
/* Light is the default. Dark only applies when <html data-theme="dark"> is set. */
:root[data-theme="dark"] {
  --bg: #0d0e1c;
  --surface: #1a1b32;
  --surface-2: #14152a;
  --ink: #eceefb;
  --muted: #9ea2c8;
  --line: #2d2f54;
  --accent: #8b7cff;
  --accent-2: #e879f9;
  --accent-ink: #12072a;
  --danger: #ff8a80;
  --scrim: rgba(0, 0, 0, 0.62);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.25);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.4), 0 10px 26px rgba(0, 0, 0, 0.45);
  --s-todo: #93a3c8;
  --s-prog: #6aa2ff;
  --s-almost: #ffb13b;
  --s-done: #39d98a;
  --s-live: #c58bff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 420px at 6% -8%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%),
    radial-gradient(760px 380px at 96% -6%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 65%),
    radial-gradient(900px 500px at 50% 112%, color-mix(in srgb, var(--s-prog) 12%, transparent), transparent 70%);
  background-repeat: no-repeat;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 22px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1500px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; }
.titles { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.015em; margin: 0 0 6px; text-wrap: balance; color: var(--ink); }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  h1 { background: linear-gradient(95deg, var(--ink) 25%, var(--accent) 70%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
}
/* A five-colour ribbon, one segment per stage, under the title. */
.titles::after { content: ""; display: block; width: 140px; height: 5px; border-radius: 3px; margin-top: 10px; background: linear-gradient(90deg, var(--s-todo) 0 20%, var(--s-prog) 20% 40%, var(--s-almost) 40% 60%, var(--s-done) 60% 80%, var(--s-live) 80% 100%); }
.sub { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-state="synced"] i { background: var(--s-done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s-done) 28%, transparent); }
.sync[data-state="offline"] i { background: var(--s-almost); }
.sync[data-state="readonly"] i { background: var(--s-prog); }

.btn { font: inherit; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .card:focus-visible, .iconbtn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 40%, transparent); }
.btn.primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn { transition: transform 0.12s ease, border-color 0.12s ease, filter 0.12s ease; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn[disabled] { opacity: 0.6; cursor: default; }

.empty-strip { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.empty-strip p { margin: 0; min-width: 0; }
.empty-strip strong { font-family: var(--font-display); font-size: 17px; display: block; }
.empty-strip span { color: var(--muted); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; align-items: start; overflow-x: auto; padding-bottom: 14px; scroll-snap-type: x proximity; }
.col { background: color-mix(in srgb, var(--stage) 7%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--stage) 22%, var(--line)); border-top: 4px solid var(--stage); border-radius: 12px; min-width: 0; scroll-snap-align: start; box-shadow: var(--shadow); }
.col.over { border-color: var(--stage); box-shadow: 0 0 0 3px color-mix(in srgb, var(--stage) 30%, transparent), var(--shadow); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 10px 8px 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--stage); }
.col[data-status="live"] .dot { box-shadow: 0 0 0 0 var(--stage); animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stage) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .col[data-status="live"] .dot { animation: none; } }
.col-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0; }
.count { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--ink); background: color-mix(in srgb, var(--stage) 22%, transparent); padding: 1px 9px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.iconbtn { font: inherit; line-height: 1; width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.iconbtn:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.col-head .iconbtn { margin-left: auto; font-size: 18px; }

.list { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 12px; min-height: 96px; }
.hint { margin: 0; padding: 14px 12px; font-size: 13px; color: var(--muted); border: 1px dashed color-mix(in srgb, var(--stage) 45%, var(--line)); border-radius: 10px; }
.drop-line { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); flex: none; margin: -1px 0; }

.card { display: grid; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--stage); border-radius: 10px; padding: 10px 10px 8px 12px; cursor: grab; min-width: 0; box-shadow: var(--shadow); transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
.card:hover { border-color: color-mix(in srgb, var(--stage) 55%, var(--line)); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .card, .btn { transition: none; } .card:hover, .btn.primary:hover { transform: none; } }
.card.dragging { opacity: 0.45; }
.readonly .card { cursor: pointer; }
.card h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.notes { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.card-foot { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 24px; }
.owner { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; color: var(--muted); }
.owner b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 20px; height: 20px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; background: linear-gradient(135deg, hsl(var(--h) 68% 46%), hsl(calc(var(--h) + 40) 70% 38%)); }
.moves { margin-left: auto; display: inline-flex; gap: 2px; flex: none; }
.moves .iconbtn { width: 26px; height: 26px; font-size: 15px; }
.moves .iconbtn[disabled] { opacity: 0.3; cursor: default; pointer-events: none; }

.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(540px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 24px 60px rgba(20, 14, 52, 0.35), inset 0 4px 0 var(--accent); }
.modal h2 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 100px; resize: vertical; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.form-err { margin: 0; color: var(--danger); font-size: 13px; min-height: 0; }
.form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grow { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: min(420px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; }

@media (max-width: 640px) {
  h1 { font-size: 26px; }
  .board { grid-auto-columns: 86%; }
}

.date { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); background: color-mix(in srgb, var(--stage) 20%, transparent); padding: 1px 8px; border-radius: 999px; white-space: nowrap; flex: none; }
.date + .moves { margin-left: 4px; }
.field-note { color: var(--muted); font-size: 12px; }
.thumbs { display: flex; gap: 6px; }
.thumb { flex: 1 1 0; min-width: 0; height: 64px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.thumb:hover { border-color: var(--stage); }
.thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.img-grid:empty { display: none; }
.img-item { position: relative; aspect-ratio: 3 / 2; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-up { display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.img-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(20, 14, 52, 0.75); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
.img-x:hover { background: var(--danger); }
.lightbox { z-index: 40; background: rgba(10, 8, 28, 0.86); grid-auto-flow: column; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; }
.lb-figure { margin: 0; min-width: 0; display: grid; justify-items: center; gap: 8px; }
.lb-figure img { max-width: 100%; max-height: 82vh; border-radius: 10px; background: var(--surface); }
.lb-figure figcaption { color: #fff; font-family: var(--font-mono); font-size: 12px; min-height: 1em; }
.lb-close { position: fixed; top: 14px; right: 14px; font-size: 20px; line-height: 1; padding: 6px 12px; }
@media (max-width: 640px) { .lightbox { grid-template-columns: 1fr; } #lbPrev, #lbNext { display: none; } }
.owner-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 12.5px; padding: 2px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate-note { margin: 0; color: var(--muted); }

/* Cards are tinted by stage so they stand out from the column behind them. */
:root:not([data-theme="dark"]) {
  --muted: #4d4a78;
  --shadow: 0 1px 2px rgba(40, 28, 110, 0.14), 0 5px 16px rgba(40, 28, 110, 0.12);
  --shadow-lift: 0 3px 6px rgba(40, 28, 110, 0.18), 0 12px 28px rgba(40, 28, 110, 0.2);
}
:root:not([data-theme="dark"]) .card { background: color-mix(in srgb, var(--stage) 18%, #ffffff); border-color: color-mix(in srgb, var(--stage) 45%, var(--line)); border-left-width: 5px; }
:root:not([data-theme="dark"]) .iconbtn:hover { background: #ffffff; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="titles">
      <h1>Team Task Board</h1>
      <p class="sub" id="summary">Loading tasks</p>
    </div>
    <div class="tools">
      <span class="sync" id="sync" data-state="connecting"><i></i><span>Connecting</span></span>
      <button type="button" class="btn primary" id="addBtn">New task</button>
    </div>
  </header>

  <div class="empty-strip" id="empty" hidden>
    <p><strong id="emptyTitle"></strong><span id="emptyText"></span></p>
    <button type="button" class="btn" id="emptyBtn">Add the first task</button>
  </div>

  <main class="board" id="board" aria-label="Task board"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" novalidate>
    <h2 id="dlgTitle">New task</h2>
    <div class="field">
      <label for="fTitle">Task</label>
      <input id="fTitle" maxlength="140" autocomplete="off" placeholder="What needs to happen?">
    </div>
    <div class="field">
      <label for="fNotes">Notes</label>
      <textarea id="fNotes" maxlength="1000" placeholder="Links, context, what done looks like"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label for="fOwner">Owner</label>
        <input id="fOwner" list="owners" maxlength="40" autocomplete="off" placeholder="Who is on it?">
        <datalist id="owners"></datalist>
        <div class="owner-chips" id="ownerChips"></div>
      </div>
      <div class="field">
        <label for="fStatus">Stage</label>
        <select id="fStatus"></select>
      </div>
    </div>
    <div class="field">
      <label for="fDate">Date (optional)</label>
      <input id="fDate" type="date">
      <small class="field-note">Set automatically to today whenever the task moves to another stage. You can still change it.</small>
    </div>
    <div class="field" id="imgField" hidden>
      <label>Images (optional)</label>
      <div class="img-grid" id="imgGrid"></div>
      <div class="img-actions">
        <button type="button" class="btn" id="imgBtn">Add image</button>
        <input type="file" id="imgFile" accept="image/*" multiple hidden>
        <small class="field-note">Or paste a screenshot with Ctrl+V. Up to 3. Images are shrunk before upload.</small>
      </div>
    </div>
    <p class="form-err" id="fErr" role="alert"></p>
    <div class="form-actions">
      <button type="button" class="btn danger" id="delBtn" hidden>Delete task</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn primary" id="saveBtn">Save task</button>
    </div>
  </form>
</div>

<div class="overlay lightbox" id="lightbox" hidden>
  <button type="button" class="btn" id="lbPrev" aria-label="Previous image">&lsaquo;</button>
  <figure class="lb-figure">
    <img id="lbImg" alt="Task image">
    <figcaption id="lbCount"></figcaption>
  </figure>
  <button type="button" class="btn" id="lbNext" aria-label="Next image">&rsaquo;</button>
  <button type="button" class="btn lb-close" id="lbClose" aria-label="Close image">&times;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="gate" hidden>
  <form class="modal" id="gateForm" novalidate>
    <h2>Team Task Board</h2>
    <p class="gate-note">Enter the team passcode to open the board.</p>
    <div class="field">
      <label for="gatePass">Passcode</label>
      <input id="gatePass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    </div>
    <p class="form-err" id="gateErr" role="alert"></p>
    <div class="form-actions">
      <span class="grow"></span>
      <button type="submit" class="btn primary" id="gateBtn">Open board</button>
    </div>
  </form>
</div>

<script src="app.js" defer></script>
</body>
</html>
